server {
    listen 80;
    listen [::]:80;
    server_name planara.example.com;

    # Uploads are limited to 250 MB (matches the application limit).
    client_max_body_size 250M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Never expose the environment file, git data, the JSON data directory or
    # the source files through the proxy.
    location ~ ^/(?:\.env|\.git|data/|server\.js$|package(?:-lock)?\.json$) {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:4574;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
